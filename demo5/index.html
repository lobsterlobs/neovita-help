<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEO VITA / One continuous movement</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0eee8;color:#111;font-family:Inter,Arial,sans-serif}header,footer{display:flex;justify-content:space-between;align-items:center;padding:20px 5%;font-size:12px;letter-spacing:.13em}button{font:inherit;color:inherit;background:none;border:1px solid #1114;border-radius:30px;padding:10px 15px;cursor:pointer}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}#controls{display:flex;gap:14px;align-items:center;padding:16px 5%;border-block:1px solid #1112}#track{height:2px;background:#1112;flex:1}#bar{height:100%;background:#ff451d}section{padding:55px 5%}h1{font-size:clamp(36px,7vw,90px);line-height:1;letter-spacing:-.065em;margin:10px 0}a{color:inherit}
</style><header><b>NEO VITA.</b><div><button id="bg">BG</button> <button id="en">EN</button></div></header><canvas id="c" width="1920" height="1080"></canvas><div id="controls"><button id="replay">↻</button><button id="sound">Sound off</button><div id="track"><div id="bar"></div></div><small id="time"></small></div><section><small>NEO VITA / 01</small><h1 id="heading"></h1><p id="desc"></p><a href="mailto:neovita26@gmail.com">neovita26@gmail.com</a></section><footer>NEO VITA / MOTION STUDY <a href="https://atelierv.design/">DesignV</a></footer><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d'),P='#f0eee8',K='#111111',O='#ff451d',B='#253cf2',TAU=Math.PI*2;
let lang='en',start=0,raf,sound=false,ac,source,token=0;
const L={en:['HEALTH','KNOWLEDGE','CHOICE','LIFE','IN','MOTION','A healthier generation starts here.','Health. Knowledge. Choice.'],bg:['ЗДРАВЕ','ЗНАНИЕ','ИЗБОР','ЖИВОТ','В','ДВИЖЕНИЕ','По-здравото поколение започва оттук.','Здраве. Знание. Избор.']};
function tr(l){lang=l;document.documentElement.lang=l;$('heading').textContent=L[l][6];$('desc').textContent=L[l][7];$('sound').textContent=l==='en'?(sound?'Sound on':'Sound off'):(sound?'Звук вкл.':'Звук изкл.')}tr('en');$('bg').onclick=()=>tr('bg');$('en').onclick=()=>tr('en');
const clamp=x=>Math.max(0,Math.min(1,x)),E=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},M=(a,b,t)=>a+(b-a)*t,seg=(t,a,b)=>E((t-a)/(b-a));
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function disk(x,y,r,col){g.beginPath();g.arc(x,y,Math.max(0,r),0,TAU);g.fillStyle=col;g.fill()}function type(s,x,y,size,col,max=1710){g.font='900 '+size+'px Inter, Arial, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle=col;g.fillText(s,x,y,max)}function ellipse(x,y,rx,ry,col){g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);g.fillStyle=col;g.fill()}
function rounded(x,y,w,h,r,col){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fillStyle=col;g.fill()}
function title(){type('NEO VITA',960,540,210,K);disk(1390,618,12,O)}
function seek(t){t=(t%15+15)%15;let w=L[lang];rect(0,0,1920,1080,P);
if(t<2){let a=seg(t,0,.48),b=seg(t,.5,1.0),d=seg(t,1,1.8);g.save();g.translate(960,540);g.scale(1-a,1);g.translate(-960,-540);title();g.restore();g.save();g.translate(960,540);g.rotate(b*Math.PI/2);rect(-M(8,540,d),-M(0,960,a),M(16,1080,d),M(0,1920,a),O);g.restore()}
else if(t<4.5){rect(0,0,1920,1080,O);let k=Math.floor((t-2)/.5),p=(t-2)% .5;let word=w[Math.min(2,Math.floor(k/2))];let a=seg(p,0,.16),b=seg(p,.31,.5);let stretch=M(.04,1,a)*(1-.96*b);g.save();g.translate(960,540);g.scale(1,stretch);type(word,0,0,400,P);g.restore();if(k%2===1){for(let i=0;i<7;i++){let y=125+i*138;rect(M(-1920,0,a),y,1920*b,5,P)}}}
else if(t<6.1){rect(0,0,1920,1080,O);let a=seg(t,4.5,5),b=seg(t,5.35,6.1);for(let i=0;i<4;i++){let x=M(390+i*380,960,b),y=540+Math.sin(i*1.6+a*2)*120*a*(1-b),r=M(120,270,b);g.save();g.translate(x,y);g.rotate((i-1.5)*a*(1-b));rounded(-r,-r,r*2,r*2,M(i%2?8:r,r,b),i===1?B:i===2?K:P);g.restore()}let v=seg(t,5.8,6.1);if(v){disk(960,540,1300*v,P);disk(960,540,270,K)}}
else if(t<8.5){let a=seg(t,6.1,6.65),b=seg(t,6.65,7.5),d=seg(t,7.5,8.5);let tilt=M(.4,1,d),h=M(85,0,d);for(let i=11;i>=0;i--){let r=M(270,375-i*26,a),y=540+(i-5.5)*h*b;ellipse(960,y,r,Math.max(14,r*tilt),i%3===0?O:i%3===1?B:K)}if(d>.2){for(let i=0;i<10;i++){g.strokeStyle=i%2?O:B;g.lineWidth=16;g.beginPath();g.arc(960,540,45+i*32,0,TAU);g.stroke()}disk(960,540,42,O)}}
else if(t<10.5){let a=seg(t,8.5,9.4),b=seg(t,9.6,10.5);let x=M(960,440,a);for(let i=0;i<10;i++){let r=45+i*32;g.strokeStyle=i%2?O:B;g.lineWidth=15;g.beginPath();g.arc(x,540,r,-Math.PI/2,-Math.PI/2+TAU*(1-a*.25));g.stroke();let len=(300+i*65)*a;rect(x+r*.35,540+(i-4.5)*44,len*(1-b),12,i%2?O:B)}disk(x,540,70,O);type('0'+(1+Math.floor((t-8.5)*2)),x,540,45,P);for(let i=0;i<23;i++){let hh=(90+180*Math.abs(Math.sin(i*1.7)))*b;rect(120+i*74,540-hh/2,37,hh,K)}}
else if(t<12){let a=seg(t,10.5,11.15),b=seg(t,11.15,12);for(let i=0;i<23;i++){let hh=M(90+180*Math.abs(Math.sin(i*1.7)),1080,a),x=M(120+i*74,960,b);rect(x-18,540-hh/2,M(37,15,b),hh,i===11?O:K)}}
else if(t<14){let k=Math.floor((t-12)/.5),u=(t-12)% .5,a=seg(u,0,.18),b=seg(u,.32,.5);rect(0,0,1920,1080,k===1?B:k===2?K:O);let word=w[3+Math.min(k,2)];g.save();g.translate(960,540);g.scale(M(.05,1,a)*(1-.94*b),1);type(word,0,0,420,P);g.restore();if(k===3){let q=seg(u,.1,.5);rect(960-960*q,0,1920*q,1080,P)}}
else{let a=seg(t,14,14.4);g.save();g.translate(960,540);g.scale(M(.05,1,a),1);g.translate(-960,-540);title();g.restore()}
$('bar').style.width=t/15*100+'%';$('time').textContent=String(Math.floor(t)).padStart(2,'0')+' / 15'}
window.seek=seek;function tick(now){seek((now-start)/1000);raf=requestAnimationFrame(tick)}
async function audio(){let n=++token;if(source){try{source.stop()}catch(e){}source=null}if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();await ac.resume();let o=new OfflineAudioContext(1,44100*15,44100),master=o.createGain();master.gain.value=.45;master.connect(o.destination);for(let i=0;i<30;i++){let t=i*.5;let osc=o.createOscillator(),v=o.createGain();osc.frequency.setValueAtTime(140,t);osc.frequency.exponentialRampToValueAtTime(43,t+.12);v.gain.setValueAtTime(.75,t);v.gain.exponentialRampToValueAtTime(.001,t+.22);osc.connect(v);v.connect(master);osc.start(t);osc.stop(t+.24);let h=o.createOscillator(),hv=o.createGain();h.type='triangle';h.frequency.value=i%4===0?520:1800;hv.gain.setValueAtTime(i%4===0?.19:.045,t);hv.gain.exponentialRampToValueAtTime(.001,t+.07);h.connect(hv);hv.connect(master);h.start(t);h.stop(t+.08)}let buffer=await o.startRendering();if(n!==token||!sound)return;source=ac.createBufferSource();source.buffer=buffer;source.loop=true;source.connect(ac.destination);source.start(0,((performance.now()-start)/1000)%15)}catch(e){sound=false;tr(lang)}}function play(){cancelAnimationFrame(raf);start=performance.now();raf=requestAnimationFrame(tick);audio()}$('replay').onclick=play;$('sound').onclick=()=>{sound=!sound;tr(lang);audio()};if(location.search.includes('render'))seek(0);else play();
</script></html>
