<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEO VITA — Life in motion</title><style>
*{box-sizing:border-box}body{margin:0;background:#101913;color:#f5f4e9;font-family:Arial,Helvetica,sans-serif}header,footer{display:flex;justify-content:space-between;align-items:center;padding:18px 5%;font-size:12px;letter-spacing:.12em}button{font:inherit;color:inherit;border:1px solid #ffffff55;background:transparent;border-radius:40px;padding:10px 16px;cursor:pointer}main{position:relative;background:#101913}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}#controls{display:flex;gap:14px;align-items:center;padding:14px 5%}#track{flex:1;height:3px;background:#ffffff22}#bar{display:block;height:100%;background:#e98249;width:0}section{padding:55px 5%;background:#f5f4e9;color:#101913}h1{font-size:clamp(34px,6vw,84px);letter-spacing:-.065em;line-height:1;margin:10px 0}p{max-width:660px;line-height:1.6}a{color:inherit}@media(max-width:650px){canvas{aspect-ratio:1/1;height:auto}header{padding:14px 5%}}
</style></head><body><header><strong>NEO VITA ●</strong><div><button id="bg">BG</button> <button id="en">EN</button></div></header><main><canvas id="screen" width="1920" height="1080"></canvas><div id="controls"><button id="play">↻ Replay</button><button id="sound">Sound off</button><div id="track"><i id="bar"></i></div><small id="time">00 / 15</small></div></main><section><small>01 / NEO VITA</small><h1 id="heading"></h1><p id="desc"></p><a href="mailto:neovita26@gmail.com">neovita26@gmail.com</a></section><footer><span>NEO VITA / LIFE IN MOTION</span><a href="https://atelierv.design/">DESIGNV</a></footer><script>
const $=id=>document.getElementById(id),c=$('screen'),g=c.getContext('2d');const ink='#101913',paper='#f5f4e9',green='#126447',orange='#ef824b';let lang='en',start=0,raf=0,sound=false,ac,source,audioToken=0;
const words={en:['HEALTH','KNOWLEDGE','CHOICE','MOVE','LEARN','CONNECT','A healthier generation starts here.','Health. Knowledge. Choice. A foundation concept dedicated to wellbeing, education and informed decisions.'],bg:['ЗДРАВЕ','ЗНАНИЕ','ИЗБОР','ДВИЖЕНИЕ','УЧЕНЕ','ОБЩНОСТ','По-здравото поколение започва оттук.','Здраве. Знание. Избор. Концепция за фондация, посветена на благополучието, образованието и информирания избор.']};
function translate(l){lang=l;document.documentElement.lang=l;$('heading').textContent=words[l][6];$('desc').textContent=words[l][7];$('play').textContent=l==='en'?'↻ Replay':'↻ Повтори';$('sound').textContent=l==='en'?(sound?'Sound on':'Sound off'):(sound?'Звук вкл.':'Звук изкл.')}translate('en');$('bg').onclick=()=>translate('bg');$('en').onclick=()=>translate('en');
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)},exp=x=>1-Math.exp(-7*clamp(x)),mix=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,Math.max(0,r),0,TAU);g.fill()}function txt(s,x,y,size,col=paper,align='center',weight=800,max=1500){g.font=weight+' '+size+'px Arial';g.textAlign=align;g.textBaseline='middle';g.fillStyle=col;g.fillText(s,x,y,max)}function line(x,y,a,b,col,w=2){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(a,b);g.stroke()}function poly(p,col){g.fillStyle=col;g.beginPath();p.forEach((v,i)=>i?g.lineTo(...v):g.moveTo(...v));g.closePath();g.fill()}
function seek(t){t=((t%15)+15)%15;const mobile=innerWidth<650;const W=1920,H=mobile?1920:1080;if(c.height!==H)c.height=H;g.setTransform(1,0,0,1,0,0);let Y=H/2,X=W/2;rect(0,0,W,H,ink);g.save();g.translate(0,Y-540);let beat=Math.floor(t*2),phase=t*2-beat,pulse=Math.exp(-8*phase);let s=Math.floor(t/2),u=t%2,word=words[lang];const safe=mobile?140:105;
if(s===0){let a=ease(t/.5),b=ease((t-1)/.5);for(let i=0;i<7;i++){let yy=540+(i-3)*95;rect(mix(910,120,a),yy-29,mix(100,1680,a),58,i===3?orange:green)}let r=mix(44,420,ease((t-.5)/.6));circle(960,540,r,paper);g.save();g.beginPath();g.arc(960,540,r,0,TAU);g.clip();txt(word[0],960,540,235,ink,'center',900,780);g.restore();rect(0,0,1920*ease((t-1.65)/.35),1080,green)}
else if(s===1){rect(0,0,1920,1080,green);let a=ease(u/.5);for(let j=0;j<5;j++){let yy=185+j*175;let shift=(j%2?1:-1)*(1-a)*1100+Math.sin(u*3+j)*25;txt(word[1],960+shift,yy,190,j===2?paper:ink,'center',900,1720)}rect(0,0,1920*ease((u-1.65)/.35),1080,paper)}
else if(s===2){rect(0,0,1920,1080,paper);let a=ease(u/.75),b=ease((u-1.35)/.65);for(let i=0;i<9;i++){let ang=i*TAU/9;let r=mix(0,420,a)*(1-b);g.save();g.translate(960+Math.cos(ang)*r,540+Math.sin(ang)*r);g.rotate(ang+u*.7);rect(-75,-75,150,150,i%3===0?orange:green);g.restore()}circle(960,540,220+80*pulse,ink);txt(word[2],960,540,160,paper,'center',900,390);rect(0,1080*(1-ease((u-1.7)/.3)),1920,1080,ink)}
else if(s===3){let a=ease(u/.7),angle=-.55+u*.45;for(let i=0;i<8;i++){let x=300+i*175,y=820,ht=(180+((i*7)%5)*85)*a+40,dx=65*Math.cos(angle),dy=-65*Math.sin(angle)-35;poly([[x,y],[x+110,y],[x+110,y-ht],[x,y-ht]],i%2?green:paper);poly([[x+110,y],[x+110+dx,y+dy],[x+110+dx,y-ht+dy],[x+110,y-ht]],i%2?'#0e4937':'#c3c6ae');poly([[x,y-ht],[x+110,y-ht],[x+110+dx,y-ht+dy],[x+dx,y-ht+dy]],orange)}txt(word[3],960,150,150,paper,'center',900);rect(0,0,1920*ease((u-1.7)/.3),1080,paper)}
else if(s===4){rect(0,0,1920,1080,paper);let a=ease(u/.5);txt('NEO VITA / 01',130,115,40,ink,'left',700);txt(word[4],130,265,160,ink,'left',900,1550);for(let i=0;i<3;i++){let x=130+i*570;rect(x,410,520,390,i===1?green:ink);txt('0'+(i+1),x+42,480,55,orange,'left');txt(word[i],x+42,565,60,paper,'left',800,435);for(let j=0;j<5;j++)rect(x+42,735-j*29,Math.max(1,(80+((i+j*3)%5)*75)*a),12,j===2?orange:paper)}rect(0,0,1920*ease((u-1.65)/.35),1080,green)}
else if(s===5){rect(0,0,1920,1080,green);let a=ease(u/.8);for(let i=0;i<12;i++){let r=70+i*47;g.strokeStyle=i%4===0?orange:paper;g.lineWidth=12;g.beginPath();g.arc(960,540,r,TAU*(i/12+u*.25),TAU*(i/12+u*.25)+TAU*a*.75);g.stroke()}circle(960,540,280,ink);txt(word[5],960,540,130,paper,'center',900,490);rect(0,0,1920*ease((u-1.7)/.3),1080,ink)}
else if(s===6){let a=ease(u/.7);for(let i=0;i<16;i++){let ang=i*TAU/16+u*.3,r=mix(600,410,a);g.save();g.translate(960+Math.cos(ang)*r,540+Math.sin(ang)*r);g.rotate(ang);rect(-95,-26,190,52,i%3===0?orange:green);g.restore()}circle(960,540,345,paper);txt('NEO',960,430,240,ink,'center',900);txt('VITA',960,650,240,ink,'center',900);rect(0,0,1920,1080*ease((u-1.7)/.3),ink)}
else{let a=ease(u/.2),b=ease((u-.65)/.35);txt('NEO VITA',960,475,220*(1-.55*b),paper,'center',900,1650);txt('DESIGNV  /  LIFE IN MOTION',960,660,45,orange,'center',700);rect(0,0,1920,1080*b,ink)}
g.restore();txt('NEO VITA  /  LIFE IN MOTION',safe,72,30,s===2||s===4?ink:paper,'left',700);txt(String(beat+1).padStart(2,'0')+' / 30',W-safe,H-72,30,s===2||s===4?ink:paper,'right',700);$('bar').style.width=t/15*100+'%';$('time').textContent=String(Math.floor(t)).padStart(2,'0')+' / 15';}
window.seek=seek;
function tick(now){let t=(now-start)/1000;if(t>=15){start+=15000*Math.floor(t/15);t=(now-start)/1000}seek(t);raf=requestAnimationFrame(tick)}
async function makeSound(){const o=new OfflineAudioContext(1,44100*15,44100);let master=o.createGain();master.gain.value=.48;master.connect(o.destination);for(let i=0;i<30;i++){let t=i*.5,osc=o.createOscillator(),v=o.createGain();osc.frequency.setValueAtTime(125,t);osc.frequency.exponentialRampToValueAtTime(44,t+.13);v.gain.setValueAtTime(.65,t);v.gain.exponentialRampToValueAtTime(.001,t+.23);osc.connect(v);v.connect(master);osc.start(t);osc.stop(t+.25);let click=o.createOscillator(),cv=o.createGain();click.type='triangle';click.frequency.value=i%4===0?880:1760;cv.gain.setValueAtTime(i%4===0?.14:.05,t);cv.gain.exponentialRampToValueAtTime(.001,t+.055);click.connect(cv);cv.connect(master);click.start(t);click.stop(t+.06)}let r=o.createOscillator(),v=o.createGain();r.type='triangle';r.frequency.setValueAtTime(110,11);r.frequency.exponentialRampToValueAtTime(880,12);v.gain.setValueAtTime(.001,11);v.gain.exponentialRampToValueAtTime(.12,11.95);v.gain.exponentialRampToValueAtTime(.001,12.1);r.connect(v);v.connect(master);r.start(11);r.stop(12.15);return o.startRendering()}
async function syncAudio(){let token=++audioToken;if(source){try{source.stop()}catch(e){}source=null}if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();await ac.resume();let buffer=await makeSound();if(token!==audioToken||!sound)return;source=ac.createBufferSource();source.buffer=buffer;source.loop=true;source.connect(ac.destination);source.start(0,((performance.now()-start)/1000)%15)}catch(e){sound=false;translate(lang)}}
function play(){cancelAnimationFrame(raf);start=performance.now();raf=requestAnimationFrame(tick);syncAudio()}$('play').onclick=play;$('sound').onclick=()=>{sound=!sound;translate(lang);syncAudio()};if(location.search.includes('render'))seek(0);else play();
</script></body></html>
