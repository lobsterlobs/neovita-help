<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEO VITA / Form follows life</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#151515;font-family:Arial,Helvetica,sans-serif}header,footer{display:flex;align-items:center;justify-content:space-between;padding:20px 5%;font-size:11px;letter-spacing:.13em}button{font:inherit;color:inherit;border:1px solid #15151535;background:none;border-radius:99px;padding:10px 15px;cursor:pointer}button[aria-pressed=true]{background:#151515;color:#fff}main{position:relative;background:#f5f2eb}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}#controls{display:flex;align-items:center;gap:12px;padding:14px 5%;border-block:1px solid #15151520}#track{flex:1;height:2px;background:#15151522}#bar{height:100%;background:#f04b27}section{padding:60px 5%;max-width:1000px}h1{font-size:clamp(34px,7vw,88px);line-height:.98;letter-spacing:-.07em;margin:16px 0}p{line-height:1.6}a{color:inherit}@media(max-width:600px){header{padding:14px 5%}canvas{aspect-ratio:4/5}}
</style></head><body><header><strong>NEO VITA.</strong><div><button id="bg">BG</button> <button id="en" aria-pressed="true">EN</button></div></header><main><canvas id="c" width="1920" height="1080" aria-label="Animated NEO VITA motion identity"></canvas><div id="controls"><button id="replay">↻ Replay</button><button id="sound" aria-pressed="false">Sound off</button><div id="track"><div id="bar"></div></div><small id="time">00 / 15</small></div></main><section><small>NEO VITA / FORM FOLLOWS LIFE</small><h1 id="heading"></h1><p id="desc"></p><a href="mailto:neovita26@gmail.com">neovita26@gmail.com</a></section><footer><span>NEO VITA / 2026</span><a href="https://atelierv.design/">MOTION BY DESIGNV</a></footer><script>
'use strict';
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d'),P='#f5f2eb',K='#171717',O='#f04b27',B='#233cfa',TAU=Math.PI*2;
const L={en:['HEALTH','KNOWLEDGE','CHOICE','LIFE','IN MOTION','A healthier generation starts here.','Health. Knowledge. Choice.'],bg:['ЗДРАВЕ','ЗНАНИЕ','ИЗБОР','ЖИВОТ','В ДВИЖЕНИЕ','По-здравото поколение започва оттук.','Здраве. Знание. Избор.']};
let lang='en',start=0,raf=0,sound=false,ac,src,buffer,token=0,last=-1;
const clamp=x=>Math.max(0,Math.min(1,x)),mix=(a,b,t)=>a+(b-a)*t,smooth=x=>{x=clamp(x);return x*x*x*(10-15*x+6*x*x)},spring=x=>{x=clamp(x);return (1-(1+8*x)*Math.exp(-8*x))/(1-9*Math.exp(-8))};
function tr(l){lang=l;document.documentElement.lang=l;$('heading').textContent=L[l][5];$('desc').textContent=L[l][6];$('bg').setAttribute('aria-pressed',String(l==='bg'));$('en').setAttribute('aria-pressed',String(l==='en'));$('replay').textContent=l==='bg'?'↻ Повтори':'↻ Replay';$('sound').textContent=l==='bg'?(sound?'Звук вкл.':'Звук изкл.'):(sound?'Sound on':'Sound off');$('sound').setAttribute('aria-pressed',String(sound))}
tr('en');$('bg').onclick=()=>tr('bg');$('en').onclick=()=>tr('en');
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function disk(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,Math.max(.01,r),0,TAU);g.fill()}function ellipse(x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),0,0,TAU);g.fill()}
function type(s,x,y,size,col,max=1580,weight=900){g.font=weight+' '+size+'px Arial,Helvetica,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle=col;g.fillText(s,x,y,max)}
function round(x,y,w,h,r,col){r=Math.max(0,Math.min(r,w/2,h/2));g.fillStyle=col;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fill()}
function color(a,b,t){const h=x=>[parseInt(x.slice(1,3),16),parseInt(x.slice(3,5),16),parseInt(x.slice(5,7),16)];const x=h(a),y=h(b);return 'rgb('+x.map((v,i)=>Math.round(mix(v,y[i],t))).join(',')+')'}
const N=24;const samples={};function textPoints(s){if(samples[s])return samples[s];const q=document.createElement('canvas');q.width=960;q.height=540;let d=q.getContext('2d');d.font='900 150px Arial';d.textAlign='center';d.textBaseline='middle';d.fillText(s,480,270,820);let m=d.getImageData(0,0,960,540).data,p=[];for(let y=10;y<540;y+=9)for(let x=10;x<960;x+=9)if(m[(y*960+x)*4+3]>200)p.push([x*2,y*2]);samples[s]=p;return p}
function glyph(s,x,y,sz,col,stretch=1){g.save();g.translate(x,y);g.scale(1,stretch);type(s,0,0,sz,col);g.restore()}
function line(x,y,X,Y,col,w){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke()}
function shape(i,k,w){let j=i%N,a=j*TAU/N,cs=Math.cos(a),sn=Math.sin(a);if(k===0)return {x:960,y:540,w:18,h:18,r:9,a:0,c:O};
if(k===1)return {x:960+(j-11.5)*63,y:540,w:48,h:600-200*Math.abs(Math.sin(j*.31)),r:0,a:0,c:j%7===0?O:K};
if(k===2)return {x:960+cs*330,y:540+sn*330,w:90,h:90,r:45,a:a,c:j%4===0?B:O};
if(k===3)return {x:960,y:540+(j-11.5)*23,w:150+560*Math.sin(Math.PI*(j+.5)/N),h:25,r:12.5,a:0,c:j%3===0?O:j%3===1?K:B};
if(k===4)return {x:220+(j%8)*208,y:300+Math.floor(j/8)*215,w:184,h:190,r:8,a:0,c:j%5===0?O:j%4===0?B:K};
if(k===5)return {x:960+cs*410,y:540+sn*410,w:110,h:34,r:17,a:a+Math.PI/2,c:j%4===0?O:B};
if(k===6)return {x:960+(j-11.5)*54,y:540,w:38,h:Math.abs(Math.sin(j*.76))*440+60,r:19,a:0,c:j%6===0?O:K};
return {x:960,y:540,w:18,h:18,r:9,a:0,c:O}}
const times=[0,1.5,3.5,5.5,8,10.5,12.5,13.9];
function seek(t){t=(t%15+15)%15;let mobile=c.clientWidth<600,H=mobile?2400:1080;if(c.height!==H)c.height=H;let w=L[lang];rect(0,0,1920,H,P);g.save();g.translate(0,(H-1080)/2);let k=0;for(let j=0;j<times.length;j++)if(t>=times[j])k=j;let next=Math.min(k+1,7),d=times[next]-times[k],u=d?clamp((t-times[k])/d):0,v=smooth(u),beat=(t*2)%1,accent=Math.exp(-8*beat);
for(let i=0;i<N;i++){let p=shape(i,k,w),q=shape(i,next,w),v2=v;let x=mix(p.x,q.x,v2),y=mix(p.y,q.y,v2),ww=mix(p.w,q.w,v2),hh=mix(p.h,q.h,v2),r=mix(p.r,q.r,v2),a=mix(p.a,q.a,v2);g.save();g.translate(x,y);g.rotate(a);round(-ww/2,-hh/2,ww,hh,r,color(p.c,q.c,v2));g.restore()}
if(t<1.5){let v=smooth(t/.7),z=smooth((t-1.1)/.4);g.save();g.beginPath();g.rect(960-880*v,200,1760*v,680);g.clip();glyph('NEO VITA',960,540,205,K,1-z*.95);g.restore();disk(1430,605,10*(1-z),O)}
else if(t<3.5){let j=Math.min(2,Math.floor((t-1.5)/.65)),a=((t-1.5)/.65)%1;let scale=smooth(a/.25)*(1-smooth((a-.72)/.28));let h=300*scale;rect(0,540-h/2,1920,h,P);g.save();g.beginPath();g.rect(0,540-h/2,1920,h);g.clip();glyph(w[j],960,540,245,K,1);g.restore()}
else if(t<5.5){let a=smooth((t-3.8)/.7)*(1-smooth((t-5)/.5));disk(960,540,180*a,K);g.save();g.beginPath();g.arc(960,540,180*a,0,TAU);g.clip();type(w[2],960,540,92,P,330);g.restore()}
else if(t<8){let a=smooth((t-5.5)/.6)*(1-smooth((t-7.6)/.4));g.save();g.beginPath();g.rect(0,0,1920,220*a);g.clip();type(w[3],960,115,146,K);g.restore()}
else if(t<10.5){let a=smooth((t-8)/.5)*(1-smooth((t-10)/.5));for(let j=0;j<3;j++){let x=960+(j-1)*430;g.save();g.beginPath();g.rect(x-175,490-85*a,350,170*a);g.clip();round(x-175,405,350,170,5,P);type('0'+(j+1),x,450,38,O);type(w[j],x,520,48,K,310);g.restore()}}
else if(t<12.5){let a=smooth((t-10.5)/.5)*(1-smooth((t-12)/.5));g.save();g.beginPath();g.rect(960-640*a,410,1280*a,260);g.clip();rect(300,410,1320,260,P);type(w[4],960,540,160,K,1200);g.restore()}
else if(t<13.9){let a=smooth((t-12.5)/.6);g.save();g.beginPath();g.rect(960-850*a,330,1700*a,420);g.clip();rect(0,330,1920,420,P);type('NEO VITA',960,540,245,K);g.restore()}
else {let a=smooth((t-13.9)/.45);g.save();g.beginPath();g.rect(960-870*a,300,1740*a,480);g.clip();type('NEO VITA',960,500,210,K);type(w[6].toUpperCase(),960,670,38,K);g.restore();disk(1430,565,10*a,O)}
g.restore();$('bar').style.width=t/15*100+'%';$('time').textContent=String(Math.floor(t)).padStart(2,'0')+' / 15'}
window.seek=seek;
function tick(now){seek((now-start)/1000);raf=requestAnimationFrame(tick)}
async function soundtrack(){if(buffer)return buffer;const o=new OfflineAudioContext(1,48000*15,48000),master=o.createGain();master.gain.value=.36;master.connect(o.destination);function tone(t,f1,f2,len,amp,kind){let a=o.createOscillator(),v=o.createGain();a.type=kind||'sine';a.frequency.setValueAtTime(f1,t);a.frequency.exponentialRampToValueAtTime(f2,t+len*.75);v.gain.setValueAtTime(.001,t);v.gain.exponentialRampToValueAtTime(amp,t+.006);v.gain.exponentialRampToValueAtTime(.001,t+len);a.connect(v);v.connect(master);a.start(t);a.stop(t+len)}for(let i=0;i<30;i++){let t=i*.5;tone(t,140,42,.22,.8);tone(t,1600,600,.045,.07,'triangle');if(i%4===0)tone(t,240,70,.28,.17,'triangle');if(i%2===1)tone(t+.25,3000,900,.035,.035,'triangle')}tone(11.5,90,860,.95,.13,'triangle');buffer=await o.startRendering();return buffer}
async function audio(){let n=++token;if(src){try{src.stop()}catch(e){}src=null}if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();await ac.resume();let b=await soundtrack();if(n!==token||!sound)return;src=ac.createBufferSource();src.buffer=b;src.loop=true;src.connect(ac.destination);src.start(0,((performance.now()-start)/1000)%15)}catch(e){sound=false;tr(lang)}}
function play(){cancelAnimationFrame(raf);start=performance.now();raf=requestAnimationFrame(tick);audio()}$('replay').onclick=play;$('sound').onclick=()=>{sound=!sound;tr(lang);audio()};if(location.search.includes('render'))seek(0);else play();
</script></body></html>
